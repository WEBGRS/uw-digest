<!doctype html>
<html lang="en" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UW Digest</title>
<meta name="description" content="Daily UW-Madison news, ranked by importance and summarized in Chinese. Get it by email.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23c5050c%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-family=%27Arial%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3EW%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">UW Digest <span data-i18n="tagline"></span></div>
    <div class="actions">
      <div class="langsw" role="group" aria-label="Language"><button type="button" class="lg" data-lang="en">EN</button><button type="button" class="lg" data-lang="zh">中文</button></div>
      <a class="btn" href="#subscribe" data-i18n="getEmail"></a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h1 data-i18n="h1"></h1>
    <p data-i18n="lede"></p>
    <p class="updated" id="updated"></p>
  </section>

  <section class="filters" aria-label="Filters">
    <div class="chips" id="cats" role="group" aria-label="Category"></div>
    <label class="minimp"><span data-i18n="show"></span>
      <select id="minimp">
        <option value="1" data-i18n="impAll"></option>
        <option value="3" selected data-i18n="imp3"></option>
        <option value="4" data-i18n="imp4"></option>
      </select>
    </label>
  </section>

  <div id="feed" aria-live="polite"></div>

  <section class="card" id="subscribe">
    <h2 data-i18n="subTitle"></h2>
    <form id="subform" novalidate>
      <label class="field"><span data-i18n="email"></span>
        <input type="email" name="email" id="email" autocomplete="email" placeholder="you@wisc.edu" required>
      </label>
      <fieldset>
        <legend data-i18n="topics"></legend>
        <div class="checks" id="subcats"></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="often"></legend>
        <div class="checks">
          <label><input type="radio" name="frequency" value="daily" checked> <span data-i18n="daily"></span></label>
          <label><input type="radio" name="frequency" value="weekly"> <span data-i18n="weekly"></span></label>
          <label><input type="radio" name="frequency" value="monthly"> <span data-i18n="monthly"></span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend data-i18n="mailLang"></legend>
        <div class="checks">
          <label><input type="radio" name="lang" value="zh"> 中文</label>
          <label><input type="radio" name="lang" value="en"> English</label>
        </div>
      </fieldset>
      <label class="field"><span data-i18n="importance"></span>
        <select name="min_importance">
          <option value="1" data-i18n="impEvery"></option>
          <option value="3" selected data-i18n="imp3"></option>
          <option value="4" data-i18n="imp4"></option>
        </select>
      </label>
      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn primary" type="submit" id="subbtn" data-i18n="subscribe"></button>
      <p class="msg" id="submsg" role="status"></p>
    </form>
  </section>
</main>

<footer class="wrap foot">
  <p data-i18n="foot"></p>
</footer>
<script src="app.js"></script>
</body>
</html>
