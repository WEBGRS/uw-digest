name = "uw-news-digest"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Production values are set at deploy time; local dev overrides live in .dev.vars
[vars]
ALLOW_ORIGINS = "https://webgrs.github.io"
SITE_URL = "https://webgrs.github.io/uw-digest"
API_URL = "https://uw-news-digest.uw-course-api.workers.dev"
MAIL_FROM = "UW Digest <digest@example.com>"

# Secrets: RESEND_API_KEY (unset = emails go to the outbox table), ADMIN_TOKEN
[[d1_databases]]
binding = "DB"
database_name = "uw-news-digest"
database_id = "f9662c15-93c5-431e-abc6-40e82d560943"

# 15:00 UTC, after the morning local build has been published
[triggers]
crons = ["0 15 * * *"]
