<!doctype html>
<html lang="en" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UW Digest</title>
<meta name="description" content="Daily UW-Madison news, ranked by importance and summarized in Chinese or English. Get it by email.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23c5050c%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-family=%27Arial%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3EW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700;8..60,900&display=swap">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<div class="utility">
  <div class="wrap">
    <span class="dateline" id="dateline"></span>
    <div class="actions">
      <label class="minimp"><span data-i18n="show"></span>
        <select id="minimp">
          <option value="1" data-i18n="impAll"></option>
          <option value="3" selected data-i18n="imp3"></option>
          <option value="4" data-i18n="imp4"></option>
        </select>
      </label>
      <div class="langsw" role="group" aria-label="Language"><button type="button" class="lg" data-lang="en">EN</button><button type="button" class="lg" data-lang="zh">中文</button></div>
      <a class="btn" href="#subscribe" data-i18n="getEmail"></a>
    </div>
  </div>
</div>

<header class="nameplate">
  <div class="wrap">
    <h1 class="logo"><a href="./">UW Digest</a></h1>
    <p class="tagline" data-i18n="tagline"></p>
  </div>
</header>

<nav class="sections" aria-label="Sections">
  <div class="wrap">
    <div class="navlist" id="cats" role="group" aria-label="Category"></div>
  </div>
</nav>

<div class="ticker" id="ticker" hidden>
  <span class="ticker-label" data-i18n="alerts"></span>
  <div class="ticker-view"><div class="ticker-track" id="tickertrack"></div></div>
</div>

<main id="main">
  <div class="wrap">
    <p class="updated" id="updated"></p>
    <section id="front" aria-live="polite"></section>
  </div>
  <section class="band" id="band" hidden>
    <div class="wrap" id="blocks"></div>
  </section>
  <div class="wrap">
    <section id="feed"></section>

    <section class="card" id="subscribe">
      <h2 data-i18n="subTitle"></h2>
      <form id="subform" novalidate>
        <label class="field"><span data-i18n="email"></span>
          <input type="email" name="email" id="email" autocomplete="email" placeholder="you@wisc.edu" required>
        </label>
        <fieldset>
          <legend data-i18n="topics"></legend>
          <div class="checks" id="subcats"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="often"></legend>
          <div class="checks">
            <label class="pill"><input type="radio" name="frequency" value="daily" checked><span data-i18n="daily"></span></label>
            <label class="pill"><input type="radio" name="frequency" value="weekly"><span data-i18n="weekly"></span></label>
            <label class="pill"><input type="radio" name="frequency" value="monthly"><span data-i18n="monthly"></span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="mailLang"></legend>
          <div class="checks">
            <label class="pill"><input type="radio" name="lang" value="zh"><span>中文</span></label>
            <label class="pill"><input type="radio" name="lang" value="en"><span>English</span></label>
          </div>
        </fieldset>
        <label class="field"><span data-i18n="importance"></span>
          <select name="min_importance">
            <option value="1" data-i18n="impEvery"></option>
            <option value="3" selected data-i18n="imp3"></option>
            <option value="4" data-i18n="imp4"></option>
          </select>
        </label>
        <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn primary" type="submit" id="subbtn" data-i18n="subscribe"></button>
        <p class="msg" id="submsg" role="status"></p>
      </form>
    </section>
  </div>
</main>

<footer class="wrap foot">
  <p data-i18n="foot"></p>
</footer>
<script src="app.js"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "bac1569834fa4682962ab1c4355c6474"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
